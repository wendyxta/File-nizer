<html>
    
    <head>
        <title> File Organizer Dashboard </title>
        <style>
            body {
                margin: 2%;
            }
            h1 {
                text-align: center;
            }
            button {
                padding: 5px 15px;
                color: rgb(205, 250, 246);
                background-color: rgb(81, 117, 247);
                float: left;
                cursor: pointer
            }
            button:hover {
                background-color: rgb(205, 250, 246);
                color: rgb(81, 117, 247)
            }
            .message {
                color: rgb(81, 117, 247);
                text-align: center;
            }
            .prompt-box {
                float:left;
                margin-left: 10%;
                align-items: center;
            }
            .result-box {
                float: right;
                margin-right: 10%
            }
            .log {
                clear: both
            }
        </style>
    </head>

    <body>
        <h1> Welcome to File-nizer! </h1>

        <div>
            <div class="prompt-box">
                <h3> Click the button below to start organizing </h3>

                <form method="POST">
                    <button type="submit">Organize my files</button>
                    {% if message %}
                        <h3 class="message"> {{ message }} </h3>
                    {% endif %}
                </form>
         
            </div>

            <div class="result-box">
                <h2> Organization Summary </h2>
                <h3> Total files organized: {{ total_files }} </h3>
                <h3> Files organized today: {{ today_files }} </h3>
                <h3> Time saved: {{ time_saved  }} </h3>
            </div>
        </div>

        <div class="log">
            <h2> Organization Log </h2>
            <iframe 
                src="https://docs.google.com/spreadsheets/d/e/2PACX-1vR1lQsvIhAU8Ur_XA5gJygdgmSzS-cVh-MuaXDUDoj3hCWMh-KEmCJXGTLpwGbkGfjxRygE6Mdcqz3H/pubhtml?gid=0&single=true&widget=false&headers=false&chrome=false"
                width="99%"
                height="70%">
            </iframe>
        </div>

    </body>

</html>
